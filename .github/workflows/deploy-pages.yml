name: Build and publish Shadow City

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare browser game
        run: |
          set -eu
          test -s index.html
          mkdir -p build
          cp index.html build/index.html
          cp -R scripts build/scripts
          test -s build/index.html
          test -s build/scripts/drive-physics.js
          echo "Browser game prepared:"
          ls -lh build/index.html build/scripts/drive-physics.js

      - name: Test browser game physics and map
        run: node --test tests/*.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Wait for Pages artifact metadata
        run: sleep 10

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
