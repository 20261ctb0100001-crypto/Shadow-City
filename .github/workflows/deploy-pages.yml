name: Build and publish Shadow City

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Run the game scene in headless mode
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee /tmp/shadow-city-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" /tmp/shadow-city-runtime.log; then
            echo "Runtime errors detected while starting the main scene."
            exit 1
          fi

      - name: Export game for the browser
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Web" build/index.html
          test -s build/index.html
          ls -lh build/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
