<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shadow City — Protótipo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:Arial,sans-serif;color:#fff}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}.panel{background:#101820cc;border:1px solid #ffffff25;border-radius:12px;padding:10px 13px;backdrop-filter:blur(8px)}#brand{position:absolute;top:12px;left:12px;font-weight:800;letter-spacing:2px}#mission{position:absolute;top:12px;right:12px;max-width:55%;font-size:12px;text-align:right}#help{position:absolute;left:12px;bottom:12px;font-size:11px;color:#d9e2e8}
#controls{position:fixed;inset:0;pointer-events:none}.joy{position:absolute;bottom:26px;left:24px;width:116px;height:116px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff60;pointer-events:auto;touch-action:none}.knob{position:absolute;width:48px;height:48px;left:32px;top:32px;border-radius:50%;background:#ffffffaa}.btn{position:absolute;right:22px;bottom:35px;width:66px;height:66px;border-radius:50%;border:1px solid #ffffff80;background:#142c3ddd;color:white;font-weight:bold;pointer-events:auto;touch-action:none}.btn2{right:98px;bottom:105px;width:54px;height:54px;font-size:11px}.btn3{right:24px;bottom:115px;width:54px;height:54px;font-size:11px}
@media(min-width:800px){.joy{width:130px;height:130px}.knob{left:39px;top:39px}#help{font-size:13px}}
</style>
</head>
<body>
<div id="hud"><div id="brand" class="panel">SHADOW CITY <span style="color:#55d6be">/ DEMO</span></div><div id="mission" class="panel">MISSÃO 01<br>Encontre o marcador verde na cidade.</div><div id="help" class="panel">WASD / setas: mover · E: entrar/sair do carro · Espaço: freio</div></div>
<div id="controls"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><button class="btn" id="action">ENTRAR</button><button class="btn btn2" id="brake">FREIO</button><button class="btn btn3" id="run">CORRER</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc4d5);scene.fog=new THREE.Fog(0x9bc4d5,55,190);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,350);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9efff,0x52604c,2));const sun=new THREE.DirectionalLight(0xfff0d6,2.1);sun.position.set(-35,65,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),mat(0x667b68));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.receiveShadow=true;scene.add(ground);
const roadMat=mat(0x30383e),lineMat=mat(0xe8dca7),sideMat=mat(0x9a9b8c);
for(let i=-4;i<=4;i++){let x=i*24;let road=new THREE.Mesh(new THREE.PlaneGeometry(9,240),roadMat);road.rotation.x=-Math.PI/2;road.position.set(x,.005,0);scene.add(road);let road2=new THREE.Mesh(new THREE.PlaneGeometry(240,9),roadMat);road2.rotation.x=-Math.PI/2;road2.position.set(0,.006,x);scene.add(road2);for(let k=-10;k<10;k++){let dash=new THREE.Mesh(new THREE.PlaneGeometry(.16,3),lineMat);dash.rotation.x=-Math.PI/2;dash.position.set(x,.02,k*12);scene.add(dash);let dash2=new THREE.Mesh(new THREE.PlaneGeometry(3,.16),lineMat);dash2.rotation.x=-Math.PI/2;dash2.position.set(k*12,.02,x);scene.add(dash2)}}
const buildingMats=[0xb7a997,0x8d9ba1,0xc2b7a5,0x747f87,0xd0c7b4].map(c=>mat(c));
let seed=8;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let gx=-4;gx<4;gx++)for(let gz=-4;gz<4;gz++){if(rand()<.12)continue;let x=gx*24+(rand()-.5)*7,z=gz*24+(rand()-.5)*7,w=7+rand()*7,d=7+rand()*7,h=7+rand()*23;let b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),buildingMats[Math.floor(rand()*buildingMats.length)]);b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);let roof=new THREE.Mesh(new THREE.BoxGeometry(w+.2,.35,d+.2),mat(0x48545b));roof.position.set(x,h+.12,z);scene.add(roof);for(let yy=2;yy<h-1;yy+=3)for(let xx=-w/2+1;xx<w/2;xx+=2.5){let win=new THREE.Mesh(new THREE.BoxGeometry(.9,1.1,.08),mat(0x395b68,.3));win.position.set(x+xx,yy,z+d/2+.05);scene.add(win)}}
function makeCar(){let g=new THREE.Group();let body=new THREE.Mesh(new THREE.BoxGeometry(2.2,.7,4),mat(0x176f76,.35));body.position.y=.75;body.castShadow=true;g.add(body);let cabin=new THREE.Mesh(new THREE.BoxGeometry(1.65,.75,1.9),mat(0x263d4a,.25));cabin.position.set(0,1.42,-.25);g.add(cabin);for(let x of [-1,1])for(let z of [-1.3,1.3]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,16),mat(0x151719));w.rotation.z=Math.PI/2;w.position.set(x,.42,z);g.add(w)}return g}
const car=makeCar();car.position.set(4,0,7);scene.add(car);
const player=new THREE.Group();const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.85,4,8),mat(0x26394c));torso.position.y=1.1;torso.castShadow=true;player.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.27,16,12),mat(0xd3a27f));head.position.y=1.85;player.add(head);scene.add(player);player.position.set(0,0,0);
const marker=new THREE.Group();let ring=new THREE.Mesh(new THREE.TorusGeometry(1.2,.12,8,28),mat(0x4affad));ring.rotation.x=Math.PI/2;ring.position.y=.15;marker.add(ring);let beam=new THREE.Mesh(new THREE.CylinderGeometry(.12,.35,3,12,1,true),new THREE.MeshBasicMaterial({color:0x4affad,transparent:true,opacity:.25}));beam.position.y=1.5;marker.add(beam);marker.position.set(34,0,-30);scene.add(marker);
let inCar=false,speed=0,angle=0,joy={x:0,y:0},keys={};let run=false,braking=false;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')toggleCar();if(e.code==='Space')braking=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')braking=false});
function toggleCar(){if(inCar){inCar=false;player.position.copy(car.position).add(new THREE.Vector3(2,0,0));player.visible=true;document.querySelector('#action').textContent='ENTRAR'}else if(player.position.distanceTo(car.position)<5){inCar=true;player.visible=false;document.querySelector('#action').textContent='SAIR'}}
document.querySelector('#action').onclick=toggleCar;document.querySelector('#run').onpointerdown=()=>run=true;document.querySelector('#run').onpointerup=()=>run=false;document.querySelector('#brake').onpointerdown=()=>braking=true;document.querySelector('#brake').onpointerup=()=>braking=false;
const joyEl=document.querySelector('#joy'),knob=document.querySelector('#knob');let active=false;
joyEl.addEventListener('pointerdown',e=>{active=true;joyEl.setPointerCapture(e.pointerId);moveJoy(e)});joyEl.addEventListener('pointermove',e=>{if(active)moveJoy(e)});function moveJoy(e){let r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.min(42,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy.x=Math.cos(a)*m/42;joy.y=Math.sin(a)*m/42;knob.style.transform='translate('+joy.x*42+'px,'+joy.y*42+'px)'}function endJoy(){active=false;joy={x:0,y:0};knob.style.transform='translate(0,0)'}joyEl.addEventListener('pointerup',endJoy);joyEl.addEventListener('pointercancel',endJoy);
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.04);let forward=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy.y;let turn=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;
if(inCar){speed+=forward*18*dt;speed*=Math.pow(braking?.04:.985,dt*60);car.rotation.y-=turn*dt*(.8+Math.min(Math.abs(speed)/10,1.5));let dir=new THREE.Vector3(Math.sin(car.rotation.y),0,Math.cos(car.rotation.y));car.position.addScaledVector(dir,speed*dt);speed=Math.max(-10,Math.min(24,speed));}
else{let move=new THREE.Vector3(turn,0,-forward);if(move.length()>1)move.normalize();if(move.lengthSq()>0){angle=Math.atan2(move.x,move.z);player.rotation.y=angle;player.position.addScaledVector(move,dt*(run?8:4.5))}if(player.position.distanceTo(car.position)<4)document.querySelector('#action').textContent='ENTRAR';}
let target=inCar?car.position:player.position;let yaw=inCar?car.rotation.y:player.rotation.y;let desired=new THREE.Vector3(target.x-Math.sin(yaw)*8, target.y+5.5,target.z-Math.cos(yaw)*8);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(target.x,target.y+1,target.z);
marker.rotation.y+=dt*.8;if(target.distanceTo(marker.position)<3){document.querySelector('#mission').innerHTML='MISSÃO CONCLUÍDA!<br>Explore a cidade livremente.';marker.position.set(-35,0,35)}
renderer.render(scene,camera)}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
