<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shadow City — Protótipo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:Arial,sans-serif;color:#fff}canvas{display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}.panel{background:#101820cc;border:1px solid #ffffff25;border-radius:12px;padding:10px 13px;backdrop-filter:blur(8px)}#brand{position:absolute;top:12px;left:12px;font-weight:800;letter-spacing:2px}#mission{position:absolute;top:12px;right:12px;max-width:55%;font-size:12px;text-align:right}#help{position:absolute;left:12px;bottom:12px;font-size:11px;color:#d9e2e8}
#controls{position:fixed;inset:0;z-index:10;pointer-events:none}.joy{position:absolute;bottom:26px;left:24px;width:116px;height:116px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff60;pointer-events:auto;touch-action:none}.knob{position:absolute;width:48px;height:48px;left:32px;top:32px;border-radius:50%;background:#ffffffaa}.btn{position:absolute;right:22px;bottom:35px;width:66px;height:66px;border-radius:50%;border:1px solid #ffffff80;background:#142c3ddd;color:white;font-weight:bold;pointer-events:auto;touch-action:none}.btn2{right:98px;bottom:105px;width:54px;height:54px;font-size:11px}.btn3{right:24px;bottom:115px;width:54px;height:54px;font-size:11px}
@media(max-width:799px){#help{display:none}.joy{left:max(16px,env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));width:112px;height:112px}.knob{left:30px;top:30px;width:48px;height:48px}.btn{right:max(16px,env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));width:64px;height:64px;font-size:11px}.btn2{right:calc(92px + env(safe-area-inset-right));bottom:calc(94px + env(safe-area-inset-bottom));width:54px;height:54px}.btn3{right:max(16px,env(safe-area-inset-right));bottom:calc(102px + env(safe-area-inset-bottom));width:54px;height:54px}}\n@media(min-width:800px){.joy{width:130px;height:130px}.knob{left:39px;top:39px}#help{font-size:13px}}
</style>
</head>
<body>
<div id="hud"><div id="brand" class="panel">SHADOW CITY <span style="color:#55d6be">/ DEMO</span></div><div id="mission" class="panel">MISSÃO 01<br>Encontre o marcador verde na cidade.</div><div id="help" class="panel">WASD / setas: mover · E: entrar/sair do carro · Espaço: freio</div></div>
<div id="controls"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><button class="btn" id="action">ENTRAR</button><button class="btn btn2" id="brake">FREIO</button><button class="btn btn3" id="run">CORRER</button></div>
<div id="loadstatus" style="position:fixed;z-index:20;top:50%;left:50%;transform:translate(-50%,-50%);padding:14px 18px;border-radius:12px;background:#101820eF;color:white;font:14px Arial;text-align:center;max-width:90vw">Carregando a cidade 3D...</div>
<script type="module">
const statusBox=document.getElementById('loadstatus');
const debugBox=document.createElement('div');
debugBox.style.cssText='position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);max-width:90vw;padding:14px 18px;border-radius:12px;background:#541b1b;color:#fff;font:13px Arial;display:none;white-space:pre-wrap';
document.body.appendChild(debugBox);
function showFatal(message){debugBox.style.display='block';debugBox.textContent='ERRO AO INICIAR O JOGO\\n'+String(message).slice(0,500);if(statusBox.isConnected)statusBox.remove();console.error(message);}
window.addEventListener('error',event=>showFatal(event.message||'Erro JavaScript desconhecido'));
window.addEventListener('unhandledrejection',event=>showFatal(event.reason?.message||event.reason||'Falha ao carregar recurso'));
let THREE;
try {
  THREE=await import('https://unpkg.com/three@0.160.0/build/three.module.js');
} catch(firstError) {
  try {
    THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
  } catch(secondError) {
    statusBox.textContent='Não foi possível carregar o motor 3D. Verifique a conexão e recarregue a página.';
    console.error('Three.js import failed',firstError,secondError);
    throw secondError;
  }
}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc4d5);scene.fog=new THREE.Fog(0x9bc4d5,95,290);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,350);
let renderer;
try {
 renderer=new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
} catch(renderError) {
 statusBox.textContent='Este navegador não conseguiu iniciar o gráfico 3D (WebGL). Tente abrir no Chrome atualizado.';
 console.error('WebGL initialization failed',renderError);
 throw renderError;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
statusBox.remove();
scene.add(new THREE.HemisphereLight(0xd9efff,0x52604c,2));const sun=new THREE.DirectionalLight(0xfff0d6,2.1);sun.position.set(-35,65,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(320,320),mat(0x667b68));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.receiveShadow=true;scene.add(ground);
const roadMat=mat(0x30383e),lineMat=mat(0xe8dca7),sideMat=mat(0x9a9b8c);
for(let i=-5;i<=5;i++){let x=i*24;let road=new THREE.Mesh(new THREE.PlaneGeometry(9,320),roadMat);road.rotation.x=-Math.PI/2;road.position.set(x,.005,0);scene.add(road);let road2=new THREE.Mesh(new THREE.PlaneGeometry(320,9),roadMat);road2.rotation.x=-Math.PI/2;road2.position.set(0,.006,x);scene.add(road2);for(let k=-13;k<14;k++){let dash=new THREE.Mesh(new THREE.PlaneGeometry(.16,3),lineMat);dash.rotation.x=-Math.PI/2;dash.position.set(x,.02,k*12);scene.add(dash);let dash2=new THREE.Mesh(new THREE.PlaneGeometry(3,.16),lineMat);dash2.rotation.x=-Math.PI/2;dash2.position.set(k*12,.02,x);scene.add(dash2)}}
const buildingMats=[0xb7a997,0x8d9ba1,0xc2b7a5,0x747f87,0xd0c7b4,0x9b765f,0x687d79,0xc0a47c].map(c=>mat(c));
const glassMat=mat(0x294b5c,.28), trimMat=mat(0x39434a,.7);
const buildingColliders=[];
let seed=8;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let gx=-5;gx<5;gx++)for(let gz=-5;gz<5;gz++){
 if(rand()<.10)continue;
 const x=gx*24+12,z=gz*24+12,w=7+rand()*7,d=7+rand()*7;
 const style=Math.floor(rand()*5),floors=style===0?1+Math.floor(rand()*2):2+Math.floor(rand()*8),h=floors*(style===0?3.2:3.5);
 const b=new THREE.Mesh(style===4?new THREE.CylinderGeometry(w*.48,w*.58,h,6):new THREE.BoxGeometry(w,h,d),buildingMats[Math.floor(rand()*buildingMats.length)]);
 b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);\n buildingColliders.push({minX:x-w/2-.35,maxX:x+w/2+.35,minZ:z-d/2-.35,maxZ:z+d/2+.35});
 const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.35,.32,d+.35),trimMat);roof.position.set(x,h+.12,z);scene.add(roof);
 if(style===0){
  const awning=new THREE.Mesh(new THREE.BoxGeometry(w+.5,.22,1.1),mat([0x9b493c,0x386b70,0xc49a45][Math.floor(rand()*3)]));awning.position.set(x,2.5,z+d/2+.25);scene.add(awning);
  const shopGlass=new THREE.Mesh(new THREE.BoxGeometry(w*.72,1.65,.09),glassMat);shopGlass.position.set(x,1.25,z+d/2+.07);scene.add(shopGlass);
 } else {
  for(let floor=1;floor<floors;floor++)for(let col=0;col<Math.max(2,Math.floor(w/2.4));col++){
   const wx=x-w/2+1.2+col*2.4,wy=floor*3.5+.65;
   const win=new THREE.Mesh(new THREE.BoxGeometry(1.15,1.45,.09),glassMat);win.position.set(wx,wy,z+d/2+.06);scene.add(win);
   if(style===1&&floor%2===0){const balcony=new THREE.Mesh(new THREE.BoxGeometry(1.55,.12,.65),trimMat);balcony.position.set(wx,wy-.65,z+d/2+.38);scene.add(balcony)}
  }
 }
 if(style===2||style===3){
  const sideFin=new THREE.Mesh(new THREE.BoxGeometry(.35,h*.8,.35),trimMat);sideFin.position.set(x-w/2+.35,h*.48,z+d/2+.1);scene.add(sideFin);
 }
 if(style===3){const tower=new THREE.Mesh(new THREE.BoxGeometry(w*.42,2,d*.42),trimMat);tower.position.set(x,h+1,z);scene.add(tower)}
}
function makeCar(){let g=new THREE.Group();let body=new THREE.Mesh(new THREE.BoxGeometry(2.2,.7,4),mat(0x176f76,.35));body.position.y=.75;body.castShadow=true;g.add(body);let cabin=new THREE.Mesh(new THREE.BoxGeometry(1.65,.75,1.9),mat(0x263d4a,.25));cabin.position.set(0,1.42,-.25);g.add(cabin);for(let x of [-1,1])for(let z of [-1.3,1.3]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,16),mat(0x151719));w.rotation.z=Math.PI/2;w.position.set(x,.42,z);g.add(w)}return g}
const car=makeCar();car.position.set(4,0,7);scene.add(car);

// Jogador com silhueta clara e membros separados para ficar visível de longe.
const player=new THREE.Group();
const jacket=mat(0xe07a32,.72),pants=mat(0x24364c,.88),skin=mat(0xc88f6a,.85),hair=mat(0x211b18,.95),shoes=mat(0x171b20,.95);
// Capsule construída com geometrias básicas do Three.js (sem addon externo).
function makeCapsule(radius,length,material){
 const group=new THREE.Group();
 const core=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,length,12),material);
 core.castShadow=true;group.add(core);
 for(const y of [-length/2,length/2]){
  const cap=new THREE.Mesh(new THREE.SphereGeometry(radius,12,10),material);
  cap.position.y=y;cap.castShadow=true;group.add(cap);
 }
 return group;
}
const torso=makeCapsule(.34,.72,jacket);
torso.position.y=1.13;player.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.255,20,16),skin);
head.position.y=1.88;head.castShadow=true;player.add(head);
const hairCap=new THREE.Mesh(new THREE.SphereGeometry(.26,16,10,0,Math.PI*2,0,Math.PI*.55),hair);
hairCap.position.set(0,1.99,-.015);player.add(hairCap);
const makeLimb=(x,y,length,radius,material)=>{
 const pivot=new THREE.Group();pivot.position.set(x,y,0);
 const limb=makeCapsule(radius,length,material);
 limb.position.y=-length*.48;pivot.add(limb);player.add(pivot);return pivot;
};
const leftArm=makeLimb(-.43,1.42,.72,.115,jacket);
const rightArm=makeLimb(.43,1.42,.72,.115,jacket);
const leftLeg=makeLimb(-.19,.78,.82,.145,pants);
const rightLeg=makeLimb(.19,.78,.82,.145,pants);
for(const x of [-.19,.19]){
 const shoe=new THREE.Mesh(new THREE.BoxGeometry(.27,.14,.42),shoes);
 shoe.position.set(x,.13,.09);shoe.castShadow=true;player.add(shoe);
}
scene.add(player);player.position.set(0,0,0);\n// Colisão simples e sólida contra as fachadas: personagem e carro não atravessam prédios.
function blockedAt(x,z,rx,rz){
 if(Math.abs(x)>157-rx||Math.abs(z)>157-rz)return true;
 for(const b of buildingColliders){
  const nearX=THREE.MathUtils.clamp(x,b.minX,b.maxX),nearZ=THREE.MathUtils.clamp(z,b.minZ,b.maxZ);
  const dx=(x-nearX)/rx,dz=(z-nearZ)/rz;
  if(dx*dx+dz*dz<1)return true;
 }
 return false;
}
function moveWithCollisions(object,dx,dz,rx,rz){
 const nextX=object.position.x+dx;
 if(!blockedAt(nextX,object.position.z,rx,rz))object.position.x=nextX;
 const nextZ=object.position.z+dz;
 if(!blockedAt(object.position.x,nextZ,rx,rz))object.position.z=nextZ;
}
camera.position.set(0,5.5,8);camera.lookAt(0,1,0);

const marker=new THREE.Group();let ring=new THREE.Mesh(new THREE.TorusGeometry(1.2,.12,8,28),mat(0x4affad));ring.rotation.x=Math.PI/2;ring.position.y=.15;marker.add(ring);let beam=new THREE.Mesh(new THREE.CylinderGeometry(.12,.35,3,12,1,true),new THREE.MeshBasicMaterial({color:0x4affad,transparent:true,opacity:.25}));beam.position.y=1.5;marker.add(beam);marker.position.set(34,0,-30);scene.add(marker);
let inCar=false,speed=0,angle=0,joy={x:0,y:0},smoothInput={x:0,y:0},keys={};let run=false,braking=false;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=true;if(k==='e')toggleCar();if(e.code==='Space')braking=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')braking=false});
function toggleCar(){if(inCar){inCar=false;player.position.copy(car.position).add(new THREE.Vector3(2,0,0));player.visible=true;document.querySelector('#action').textContent='ENTRAR'}else if(player.position.distanceTo(car.position)<5){inCar=true;player.visible=false;document.querySelector('#action').textContent='SAIR'}}
document.querySelector('#action').onclick=toggleCar;for(const [id,setter] of [['run',v=>run=v],['brake',v=>braking=v]]){const el=document.querySelector('#'+id);el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);setter(true)});el.addEventListener('pointerup',()=>setter(false));el.addEventListener('pointercancel',()=>setter(false));}
const joyEl=document.querySelector('#joy'),knob=document.querySelector('#knob');let active=false;
joyEl.addEventListener('pointerdown',e=>{active=true;joyEl.setPointerCapture(e.pointerId);moveJoy(e)});joyEl.addEventListener('pointermove',e=>{if(active)moveJoy(e)});function moveJoy(e){let r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.min(42,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);const rawX=Math.cos(a)*m/42,rawY=Math.sin(a)*m/42,dead=.14;joy.x=Math.abs(rawX)<dead?0:Math.sign(rawX)*Math.pow((Math.abs(rawX)-dead)/(1-dead),1.35);joy.y=Math.abs(rawY)<dead?0:Math.sign(rawY)*Math.pow((Math.abs(rawY)-dead)/(1-dead),1.35);knob.style.transform='translate('+rawX*42+'px,'+rawY*42+'px)'}function endJoy(){active=false;joy={x:0,y:0};knob.style.transform='translate(0,0)'}joyEl.addEventListener('pointerup',endJoy);joyEl.addEventListener('pointercancel',endJoy);
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);try{let dt=Math.min(clock.getDelta(),.04);let forward=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy.y;let turn=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;smoothInput.x=THREE.MathUtils.damp(smoothInput.x,turn,9,dt);smoothInput.y=THREE.MathUtils.damp(smoothInput.y,forward,9,dt);turn=smoothInput.x;forward=smoothInput.y;
if(inCar){speed+=forward*12*dt;speed*=Math.pow(braking?.04:.985,dt*60);car.rotation.y-=turn*dt*(.48+Math.min(Math.abs(speed)/18,.65));let dir=new THREE.Vector3(Math.sin(car.rotation.y),0,Math.cos(car.rotation.y));const carStep=dir.clone().multiplyScalar(speed*dt);moveWithCollisions(car,carStep.x,carStep.z,1.25,2.15);speed=Math.max(-10,Math.min(24,speed));}
else{let move=new THREE.Vector3(turn,0,-forward);if(move.length()>1)move.normalize();if(move.lengthSq()>0){angle=Math.atan2(move.x,move.z);player.rotation.y=angle;const step=move.clone().multiplyScalar(dt*(run?5.8:3.1));moveWithCollisions(player,step.x,step.z,.43,.43);leftArm.rotation.x=Math.sin(performance.now()*.012)*.45;rightArm.rotation.x=-leftArm.rotation.x;leftLeg.rotation.x=-leftArm.rotation.x*.8;rightLeg.rotation.x=leftArm.rotation.x*.8;}else{leftArm.rotation.x*=.82;rightArm.rotation.x*=.82;leftLeg.rotation.x*=.82;rightLeg.rotation.x*=.82;}if(player.position.distanceTo(car.position)<4)document.querySelector('#action').textContent='ENTRAR';}
let target=inCar?car.position:player.position;let yaw=inCar?car.rotation.y:player.rotation.y;let desired=new THREE.Vector3(target.x-Math.sin(yaw)*9, target.y+6.2,target.z-Math.cos(yaw)*9);camera.position.lerp(desired,1-Math.pow(.003,dt));camera.lookAt(target.x,target.y+1,target.z);
marker.rotation.y+=dt*.8;if(target.distanceTo(marker.position)<3){document.querySelector('#mission').innerHTML='MISSÃO CONCLUÍDA!<br>Explore a cidade livremente.';marker.position.set(-35,0,35)}
renderer.render(scene,camera)}catch(loopError){showFatal('Falha no ciclo 3D: '+(loopError?.stack||loopError));}}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
