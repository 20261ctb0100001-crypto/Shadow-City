<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Truck Simulator — Estradas do Brasil</title>
<!-- Truck Simulator update: terrain, camera modes, traffic, refueling and cruise control -->
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8eb4c5;color:#fff;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}.panel{background:#101820d9;border:1px solid #ffffff30;border-radius:13px;padding:10px 13px;backdrop-filter:blur(8px);box-shadow:0 4px 18px #0003}#brand{position:absolute;top:12px;left:12px;font-weight:900;letter-spacing:1.5px;font-size:14px}#mission{position:absolute;top:12px;right:12px;text-align:right;font-size:12px;max-width:58%}#stats{position:absolute;left:12px;top:62px;font-size:12px;line-height:1.6}#help{position:absolute;bottom:12px;left:12px;font-size:11px;color:#e3edf1}
#controls{position:fixed;inset:0;pointer-events:none;z-index:5}.joy{position:absolute;left:22px;bottom:24px;width:120px;height:120px;border-radius:50%;background:#ffffff24;border:2px solid #ffffff80;pointer-events:auto;touch-action:none}.knob{position:absolute;left:34px;top:34px;width:48px;height:48px;border-radius:50%;background:#ffffffc9;box-shadow:0 2px 10px #0005}.pedals{position:absolute;right:14px;bottom:18px;display:flex;gap:12px;align-items:end;padding:10px 12px 8px;background:linear-gradient(145deg,#10171bd9,#29343bd9);border:1px solid #aebbc455;border-radius:18px 18px 13px 13px;box-shadow:0 7px 22px #0007;pointer-events:auto}.btn{position:relative;width:68px;height:112px;border:2px solid #7d898e;border-radius:12px 12px 9px 9px;clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);background:linear-gradient(100deg,#252d32,#667177 23%,#30393e 50%,#707b80 77%,#252d32);color:#fff;font-weight:900;font-size:10px;letter-spacing:.7px;text-shadow:0 1px 3px #000;touch-action:none;display:flex;align-items:end;justify-content:center;padding-bottom:12px;box-shadow:inset 0 0 0 2px #101719,0 4px 7px #0008; transform:perspective(140px) rotateX(7deg)}.btn:before{content:'';position:absolute;inset:9px 9px 31px;border-radius:5px;background:repeating-linear-gradient(0deg,#111a1f 0 5px,#8c969a 5px 8px,#20282d 8px 12px);border:1px solid #9ba5a866;opacity:.95}.btn span{position:relative;z-index:1}.btn.gas{height:98px;width:57px;background:linear-gradient(100deg,#203b36,#5b7770 25%,#263e39 55%,#718b82 78%,#203b36)}.btn.active{filter:brightness(1.55);border-color:#b7ffe4;box-shadow:0 0 0 2px #49d7a8,0 0 20px #49d7a888,inset 0 0 0 2px #101719;transform:perspective(140px) rotateX(13deg) translateY(3px)}.btn:active{filter:brightness(1.45)}#load{position:fixed;inset:0;display:grid;place-items:center;background:#101820;color:#fff;z-index:20;font-weight:bold}
@media(min-width:800px){.joy{width:140px;height:140px}.knob{left:44px;top:44px}#help{font-size:13px}}
@media(max-width:520px){#stats{top:61px;font-size:11px}.panel{padding:8px 10px}.joy{width:108px;height:108px;left:14px;bottom:17px}.knob{width:44px;height:44px;left:30px;top:30px}.pedals{right:12px;bottom:18px;gap:7px}.btn{width:61px;height:100px;font-size:9px}.btn.gas{width:51px;height:88px}}
</style>
</head>
<body>
<div id="load">Preparando seu caminhão...</div>
<div id="hud">
 <div id="brand" class="panel">TRUCK SIMULATOR <span style="color:#65dfb6">BR</span></div>
 <div id="mission" class="panel">ENTREGA 01<br>Leve a carga até o posto marcado.</div>
 <div id="stats" class="panel">Velocidade: <b id="speed">0</b> km/h<br>Marcha: <b id="gear">N</b><br>Combustível: <b id="fuel">100</b>%</div>
 <div id="help" class="panel">WASD / setas: dirigir · Espaço: freio · R: reiniciar caminhão</div>
</div>
<div id="controls"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div style="position:absolute;top:105px;right:12px;display:flex;gap:7px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:58%"><button id="viewBtn" class="panel" style="color:white;border:1px solid #ffffff66">1ª PESSOA</button><button id="cruiseBtn" class="panel" style="color:white;border:1px solid #ffffff66">LIMITADOR: OFF</button><button id="refuelBtn" class="panel" style="color:white;border:1px solid #ffffff66;display:none">ABASTECER</button></div><div class="pedals" aria-label="Pedais do caminhão"><button class="btn" id="brake" aria-label="Pedal de freio"><span>FREIO</span></button><button class="btn gas" id="gas" aria-label="Pedal do acelerador"><span>ACELERAR</span></button></div></div>
<script type="module">
const load=document.getElementById('load');
let THREE;
try{THREE=await import('https://unpkg.com/three@0.160.0/build/three.module.js')}catch(e){THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js')}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc3d2);scene.fog=new THREE.Fog(0x9fc3d2,100,430);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,600);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f5ff,0x59634c,2.0));const sun=new THREE.DirectionalLight(0xffe5bd,2.1);sun.position.set(-80,120,65);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-110;sun.shadow.camera.right=110;sun.shadow.camera.top=110;sun.shadow.camera.bottom=-110;scene.add(sun);
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const asphalt=mat(0x343b40),grass=mat(0x587b50),line=mat(0xe9e3c8),white=mat(0xe8e8df),rubber=mat(0x141719),glass=mat(0x243f4b,.22,.25);
// Textura procedural de terra e capim em vez de um plano verde liso.
const turfCanvas=document.createElement('canvas');turfCanvas.width=512;turfCanvas.height=512;const ctx=turfCanvas.getContext('2d');ctx.fillStyle='#637d4b';ctx.fillRect(0,0,512,512);for(let i=0;i<18000;i++){const x=Math.random()*512,y=Math.random()*512;ctx.fillStyle=['#3f653e','#78905a','#8a8759','#a08c65','#526f42'][Math.floor(Math.random()*5)];ctx.globalAlpha=.18+Math.random()*.32;ctx.fillRect(x,y,1+Math.random()*3,1+Math.random()*2)}ctx.globalAlpha=1;const turfTex=new THREE.CanvasTexture(turfCanvas);turfTex.wrapS=turfTex.wrapT=THREE.RepeatWrapping;turfTex.repeat.set(34,34);turfTex.colorSpace=THREE.SRGBColorSpace;const groundMat=new THREE.MeshStandardMaterial({map:turfTex,roughness:1});const ground=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),groundMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.18;ground.receiveShadow=true;scene.add(ground);

function road(x,z,w,d){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),asphalt);m.rotation.x=-Math.PI/2;m.position.set(x,-.12,z);m.receiveShadow=true;scene.add(m)}
road(0,0,22,1000);road(0,-190,700,18);road(0,190,700,18);
for(let z=-490;z<500;z+=12){const dash=new THREE.Mesh(new THREE.PlaneGeometry(.22,5),line);dash.rotation.x=-Math.PI/2;dash.position.set(0,-.105,z);scene.add(dash)}
for(let x=-340;x<=340;x+=18){const d=new THREE.Mesh(new THREE.PlaneGeometry(6,.22),line);d.rotation.x=-Math.PI/2;d.position.set(x,-.105,-190);scene.add(d);const d2=d.clone();d2.position.z=190;scene.add(d2)}
// Paisagem rural, morros suaves e árvores variadas.
for(let i=0;i<90;i++){const x=(Math.random()-.5)*650,z=(Math.random()-.5)*900;if(Math.abs(x)<17)continue;const h=8+Math.random()*20;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35,.55,h*.28,7),mat(0x59432f));trunk.position.set(x,h*.14,z);trunk.castShadow=true;scene.add(trunk);const crown=new THREE.Mesh(new THREE.SphereGeometry(h*.32,9,7),mat([0x315f3b,0x426e42,0x567c48][i%3]));crown.position.set(x,h*.56,z);crown.scale.set(1,1.2,1);crown.castShadow=true;scene.add(crown)}
// Arbustos, capim alto e pequenas pedras nas margens para dar profundidade à paisagem.
for(let i=0;i<320;i++){const x=(Math.random()-.5)*620,z=(Math.random()-.5)*900;if(Math.abs(x)<15)continue;const g=new THREE.Group();const stem=new THREE.Mesh(new THREE.ConeGeometry(.12,.8+Math.random()*1.1,5),mat([0x557b3e,0x6c8b48,0x87934f][i%3]));stem.position.y=.4;g.add(stem);for(let j=0;j<3;j++){const leaf=new THREE.Mesh(new THREE.ConeGeometry(.12,.65,5),stem.material);leaf.position.set((Math.random()-.5)*.3,.25+Math.random()*.35,(Math.random()-.5)*.3);leaf.rotation.z=(Math.random()-.5)*.7;g.add(leaf)}g.position.set(x,0,z);scene.add(g)}
for(let i=0;i<95;i++){const x=(Math.random()-.5)*620,z=(Math.random()-.5)*900;if(Math.abs(x)<17)continue;const shrub=new THREE.Mesh(new THREE.SphereGeometry(.8+Math.random()*1.2,7,5),mat([0x355d36,0x466b39,0x647c43][i%3]));shrub.position.set(x,.55,z);shrub.scale.y=.65;shrub.castShadow=true;scene.add(shrub)}
for(let i=0;i<28;i++){const x=(Math.random()-.5)*520,z=(Math.random()-.5)*850;if(Math.abs(x)<18)continue;const w=12+Math.random()*20,h=5+Math.random()*14,d=12+Math.random()*20;const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat([0xb4a28b,0x9babae,0xc4bba7,0x8d9992][i%4]));b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.5,.45,d+.5),mat(0x454b4a));roof.position.set(x,h+.2,z);scene.add(roof)}
// Posto de combustível na lateral da estrada.
const station=new THREE.Group();const shop=new THREE.Mesh(new THREE.BoxGeometry(16,5,10),mat(0xe2dfd2));shop.position.y=2.5;station.add(shop);const roof=new THREE.Mesh(new THREE.BoxGeometry(20,.6,13),mat(0xb83e32));roof.position.set(0,5.2,0);station.add(roof);for(let x of [-6,6]){const col=new THREE.Mesh(new THREE.BoxGeometry(.45,5,.45),white);col.position.set(x,2.5,5);station.add(col)}station.position.set(27,0,-105);scene.add(station);
function box(parent,w,h,d,material,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function wheel(parent,x,y,z,r=.72,width=.48){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,width,18),rubber);o.rotation.z=Math.PI/2;o.position.set(x,y,z);o.castShadow=true;parent.add(o);const hub=new THREE.Mesh(new THREE.CylinderGeometry(r*.48,r*.48,width+.02,16),mat(0x9ba3a4,.35,.7));hub.rotation.z=Math.PI/2;hub.position.copy(o.position);parent.add(hub)}
// Cavalo mecânico com cabine, para-brisa, retrovisores, grade e semirreboque.
const truck=new THREE.Group(),tractor=new THREE.Group(),trailer=new THREE.Group();truck.add(tractor);truck.add(trailer);
box(tractor,2.8,1.15,4.4,mat(0xb72f2b,.42,.18),0,1.15,.35);
box(tractor,2.65,2.45,2.35,mat(0xc83a32,.38,.15),0,2.75,-1.05);
box(tractor,2.42,1.15,.12,glass,0,3.05,.15);box(tractor,2.48,1.05,.12,glass,0,3.05,-2.24);
box(tractor,2.7,.25,.18,mat(0x262c30),0,1.55,1.5);box(tractor,2.1,.8,.12,mat(0x292f32),0,2.1,1.57);
box(tractor,.16,.9,.18,mat(0xd8d8cf),-1.42,2.25,-1.15);box(tractor,.16,.9,.18,mat(0xd8d8cf),1.42,2.25,-1.15);
for(const x of [-1.48,1.48]){box(tractor,.12,.55,.16,mat(0x20282d),x,2.8,.05);box(tractor,.5,.16,.18,mat(0x20282d),x*1.12,3.02,.02)}
for(const z of [-1.05,1.25])for(const x of [-1.52,1.52])wheel(tractor,x,.72,z,.66,.42);
box(trailer,2.9,3.35,10.8,mat(0xd7dce0,.6,.12),0,2.55,-8.25);
box(trailer,2.94,.22,10.9,mat(0x3c464b),0,.85,-8.25);
for(let z=-13.2;z<-3.1;z+=2.5){box(trailer,2.96,.07,.08,mat(0x9aa2a5),0,4.25,z)}
for(const x of [-1.55,1.55])for(const z of [-11.8,-9.7,-7.6,-5.5])wheel(trailer,x,.68,z,.62,.42);
box(trailer,2.5,.16,.15,mat(0xb72f2b),0,1.1,-13.7);
truck.position.set(0,0,65);truck.rotation.y=Math.PI;scene.add(truck);
const cargo=new THREE.Group();for(let i=0;i<10;i++){const c=new THREE.Mesh(new THREE.BoxGeometry(.8,.55,.8),mat([0x9a7651,0xb48c5d,0x7d644a][i%3]));c.position.set((i%2)*.9-.45,1.25+Math.floor(i/2)*.58,-7-Math.floor(i/2)*1.1);cargo.add(c)}trailer.add(cargo);
const marker=new THREE.Group();const ring=new THREE.Mesh(new THREE.TorusGeometry(4,.35,10,40),mat(0x43ffc0,.35));ring.rotation.x=Math.PI/2;ring.position.y=.2;marker.add(ring);const beam=new THREE.Mesh(new THREE.CylinderGeometry(.35,1.1,12,16,1,true),new THREE.MeshBasicMaterial({color:0x43ffc0,transparent:true,opacity:.17}));beam.position.y=6;marker.add(beam);marker.position.set(27,0,-105);scene.add(marker);
let speed=0,steer=0,throttle=0,brake=0,delivered=false,fuel=100,joy={x:0,y:0},keys={};
let firstPerson=false,cruiseOn=false,cruiseSpeed=0;
const traffic=[];
function makeTrafficCar(x,z,color,dir=1){const car=new THREE.Group();box(car,1.9,.75,4,mat(color,.45,.12),0,1,0);box(car,1.75,.65,1.5,glass,0,1.65,-.25);for(const zz of [-1.25,1.25])for(const xx of [-1.02,1.02])wheel(car,xx,.55,zz,.43,.28);car.position.set(x,0,z);car.userData.dir=dir;scene.add(car);traffic.push(car)}
for(let i=0;i<13;i++){const z=-440+i*68;makeTrafficCar(i%2? -4.8:4.8,z,[0x2d6eaa,0xd9d5c9,0x383c43,0x9a342c,0x8d9d4c][i%5],i%2?1:-1)}

function updateStats(){document.getElementById('speed').textContent=Math.round(Math.abs(speed)*3.6);document.getElementById('gear').textContent=speed>.4?'D':speed<-.4?'R':'N';document.getElementById('fuel').textContent=Math.round(fuel)}
function setHold(id,fn){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);fn(true);el.classList.add('active')});const end=()=>{fn(false);el.classList.remove('active')};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('lostpointercapture',end)}
setHold('gas',v=>throttle=v?1:0);setHold('brake',v=>brake=v?1:0);
const viewBtn=document.getElementById('viewBtn'),cruiseBtn=document.getElementById('cruiseBtn'),refuelBtn=document.getElementById('refuelBtn');
viewBtn.addEventListener('click',()=>{firstPerson=!firstPerson;viewBtn.textContent=firstPerson?'3ª PESSOA':'1ª PESSOA'});
cruiseBtn.addEventListener('click',()=>{cruiseOn=!cruiseOn;cruiseSpeed=Math.max(8,Math.abs(speed));cruiseBtn.textContent=cruiseOn?'LIMITADOR: '+Math.round(cruiseSpeed*3.6)+' KM/H':'LIMITADOR: OFF';cruiseBtn.style.background=cruiseOn?'#176c54':'#101820d9'});
refuelBtn.addEventListener('click',()=>{if(truck.position.distanceTo(station.position)<24&&Math.abs(speed)<.7){fuel=100;document.getElementById('mission').innerHTML='TANQUE CHEIO<br>Boa viagem!';refuelBtn.style.display='none'}});

addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(k==='r'){truck.position.set(0,0,65);truck.rotation.y=Math.PI;speed=0;fuel=100;delivered=false;marker.visible=true;document.getElementById('mission').innerHTML='ENTREGA 01<br>Leve a carga até o posto marcado.'}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const joyEl=document.getElementById('joy'),knob=document.getElementById('knob');let joyActive=false;
function joyMove(e){const r=joyEl.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.min(42,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy.x=Math.cos(a)*m/42;joy.y=Math.sin(a)*m/42;knob.style.transform='translate('+joy.x*42+'px,'+joy.y*42+'px)'}
joyEl.addEventListener('pointerdown',e=>{joyActive=true;joyEl.setPointerCapture(e.pointerId);joyMove(e)});joyEl.addEventListener('pointermove',e=>{if(joyActive)joyMove(e)});function joyEnd(){joyActive=false;joy={x:0,y:0};knob.style.transform='translate(0,0)'}joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.04);last=now;
const fwd=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy.y;const turn=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;const gasInput=Math.max(throttle,fwd>0?fwd:0),brakeInput=Math.max(brake,fwd<0?-fwd:0);
if(cruiseOn&&!brakeInput){const target=cruiseSpeed/3.6;speed=THREE.MathUtils.damp(speed,target,1.8,dt)}else if(gasInput>0)speed+=gasInput*5.5*dt;else speed*=Math.pow(.985,dt*60);if(brakeInput>0){speed*=Math.pow(.08,brakeInput*dt*60);if(brakeInput>.3)cruiseOn=false}speed=THREE.MathUtils.clamp(speed,-5,31);
steer=THREE.MathUtils.damp(steer,THREE.MathUtils.clamp(turn,-1,1),5,dt);truck.rotation.y-=steer*dt*(.16+Math.min(Math.abs(speed)/25,.45))*Math.sign(speed||1);
const direction=new THREE.Vector3(Math.sin(truck.rotation.y),0,Math.cos(truck.rotation.y));truck.position.addScaledVector(direction,speed*dt);
truck.position.x=THREE.MathUtils.clamp(truck.position.x,-330,330);truck.position.z=THREE.MathUtils.clamp(truck.position.z,-480,480);
if(Math.abs(speed)>1)fuel=Math.max(0,fuel-dt*.018*Math.abs(speed));if(fuel<=0)speed*=.98;
const target=firstPerson?new THREE.Vector3(truck.position.x+direction.x*1.2,3.45,truck.position.z+direction.z*1.2):new THREE.Vector3(truck.position.x-direction.x*18,truck.position.y+10,truck.position.z-direction.z*18);camera.position.lerp(target,1-Math.pow(firstPerson?.00002:.002,dt));camera.lookAt(firstPerson?new THREE.Vector3(truck.position.x+direction.x*35,3.1,truck.position.z+direction.z*35):new THREE.Vector3(truck.position.x,2.1,truck.position.z+direction.z*4));
for(const car of traffic){car.position.z+=car.userData.dir*dt*(14+Math.sin(now*.0004)*2);if(car.position.z>490)car.position.z=-490;if(car.position.z< -490)car.position.z=490}
const nearStation=truck.position.distanceTo(station.position)<24;refuelBtn.style.display=nearStation&&Math.abs(speed)<.7?'block':'none';

marker.rotation.y+=dt*.7;if(!delivered&&truck.position.distanceTo(marker.position)<15){delivered=true;document.getElementById('mission').innerHTML='ENTREGA CONCLUÍDA!<br>Carga entregue. Continue dirigindo.';marker.visible=false}
updateStats();renderer.render(scene,camera)}
camera.position.set(0,10,88);camera.lookAt(0,2,65);load.remove();requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
